<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favico.png" />
    <!--
      Fonty tekstu i danych (IBM Plex Sans / IBM Plex Mono) są teraz LOKALNE:
      bundlowane przez Vite z pakietów @fontsource, importowane w src/main.tsx.
      Żadnych preconnect/link do fonts.googleapis.com ani fonts.gstatic.com —
      aplikacja nie wysyła w runtime żadnego żądania do zewnętrznych CDN. Grafiki
      również idą z własnego Backendu (/static), stąd brak preconnect do
      images.asyncti4.com.
    -->
    <!--
      Font logo (Ambroise Firmin) WPROST w index.html + preload, żeby splash
      renderowany PRZED bundlem miał ten sam krój co React BootScreen (inaczej logo
      splashu wyglądałoby inaczej — fallback serif). Ta sama definicja co
      src/styles/fonts.css; plik z /font (public/font).
    -->
    <link
      rel="preload"
      href="/font/ambroise-firmin-bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: "Ambroise Firmin";
        src:
          url("/font/ambroise-firmin-bold.woff2") format("woff2"),
          url("/font/Ambroise Firmin Bold.otf") format("opentype");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <!-- Enable pinch-zoom out below 1 and allow user scaling -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=0.1, maximum-scale=5, user-scalable=yes"
    />
    <meta
      name="description"
      content="Custodian Engine – lokalny asystent i przeciwnik AI do fizycznych rozgrywek Twilight Imperium 4th Edition."
    />
    <title>Custodian Engine · Twilight Imperium 4</title>
  </head>
  <body>
    <!--
      Splash ladowania: czysty HTML/CSS, renderuje sie w PIERWSZEJ klatce (zanim
      zaladuje sie ciezki bundel React ~3 MB). React montuje do #root i podmienia
      jego zawartosc, wiec splash znika sam. Koniec "bialego ekranu".
    -->
    <div id="root">
      <!--
        Splash ladowania ODWZOROWUJE ekran rozruchu Reacta (``BootScreen`` w
        StartScreen): ten sam ciemny kadr z grafika menu + winieta, logo „Custodian
        Engine" i animowany PASEK POSTEPU (gradient TI4) zamiast kreciolka. Dzieki
        temu od pierwszej klatki widac WLASCIWY ekran ladowania, a nie stary spinner,
        ktory potem skakal na nowy. Wartosci wpisane wprost (HTML przed bundlem nie
        ma tokenow CSS) — spojne z StartScreen.module.css.
      -->
      <style>
        #boot-splash {
          position: fixed;
          inset: 0;
          display: grid;
          place-items: center;
          padding: 2rem;
          color: #cbd5e1;
          font-family: "IBM Plex Sans", system-ui, sans-serif;
          background:
            radial-gradient(
              ellipse 100% 70% at 50% 40%,
              rgba(252, 162, 43, 0.08),
              transparent 70%
            ),
            linear-gradient(rgba(0, 0, 0, 0.86), rgba(0, 0, 0, 0.92)),
            url("/static/extra/main_menu.jpg") center / cover no-repeat,
            #0b0b0c;
        }
        #boot-splash::before {
          content: "";
          position: absolute;
          inset: 0;
          pointer-events: none;
          background: radial-gradient(
            ellipse 85% 75% at 50% 50%,
            transparent 50%,
            rgba(0, 0, 0, 0.6) 100%
          );
        }
        #boot-splash .bs-inner {
          position: relative;
          z-index: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 2rem;
        }
        #boot-splash .bs-brand-wrap {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 0.25rem;
        }
        /*
          Logo splashu MUSI wygladac tak samo jak React BootScreen (ten sam krój
          Ambroise Firmin + gradient TI4 wyciety w literach + scaleY), inaczej
          przejscie splash -> React wyglada jak przeskok dwóch róznych ekranów.
          Wartosci zsynchronizowane z .menuTitle/.bootTitle w StartScreen.module.css.
        */
        #boot-splash .bs-brand {
          margin: 0.22em 0;
          font-family: "Ambroise Firmin", "Slider", system-ui, serif;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.12em;
          text-indent: 0.12em;
          font-size: clamp(2rem, 6vw, 3.75rem);
          line-height: 1;
          transform: scaleY(1.45);
          transform-origin: center;
          background: linear-gradient(
            180deg,
            #f24a21 0%,
            #f6792a 32%,
            #fca22b 62%,
            #ffd34a 100%
          );
          -webkit-background-clip: text;
          background-clip: text;
          -webkit-text-fill-color: transparent;
          color: transparent;
          filter: drop-shadow(0 0 18px rgba(246, 121, 42, 0.35));
        }
        /* Pozioma kreska pod logo — jak w React BootScreen (.titleRule). */
        #boot-splash .bs-rule {
          width: min(72vw, 640px);
          height: 3px;
          border-radius: 2px;
          margin-top: 0.1rem;
          background: linear-gradient(
            90deg,
            transparent 0%,
            #f24a21 12%,
            #fca22b 50%,
            #ffd34a 72%,
            #f24a21 88%,
            transparent 100%
          );
          box-shadow: 0 0 16px rgba(246, 121, 42, 0.5);
        }
        #boot-splash .bs-status {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 1rem;
          width: min(82vw, 460px);
          padding: 1.25rem 2rem;
          border: 1px solid rgba(255, 255, 255, 0.14);
          border-radius: 10px;
          background: rgba(21, 21, 23, 0.7);
          backdrop-filter: blur(6px);
          box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        #boot-splash .bs-track {
          position: relative;
          width: 100%;
          height: 4px;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.08);
          overflow: hidden;
          box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        }
        #boot-splash .bs-bar {
          position: absolute;
          top: 0;
          left: -42%;
          height: 100%;
          width: 40%;
          border-radius: 999px;
          background: linear-gradient(90deg, #f24a21, #fca22b, #ffd34a);
          box-shadow: 0 0 12px rgba(246, 121, 42, 0.6);
          animation: bs-slide 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        #boot-splash .bs-sub {
          margin: 0;
          font-size: 13px;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          color: #94a3b8;
        }
        @keyframes bs-slide {
          0% {
            left: -42%;
          }
          100% {
            left: 102%;
          }
        }
        @keyframes bs-pulse {
          0%,
          100% {
            opacity: 0.5;
          }
          50% {
            opacity: 1;
          }
        }
        /*
          Reduced-motion: zamiast zatrzymywać pasek (wygląda jak zawieszony),
          zostawiamy spokojne pulsowanie na pełnej szerokości — tak samo jak
          React BootScreen (bootPulse). Ruch poziomy wyłączony, pulsowanie zostaje.
        */
        @media (prefers-reduced-motion: reduce) {
          #boot-splash .bs-bar {
            animation: bs-pulse 1.4s ease-in-out infinite;
            left: 0;
            width: 100%;
          }
        }
      </style>
      <div id="boot-splash">
        <div class="bs-inner">
          <div class="bs-brand-wrap">
            <h1 class="bs-brand">Custodian Engine</h1>
            <div class="bs-rule"></div>
          </div>
          <div class="bs-status">
            <div class="bs-track"><span class="bs-bar"></span></div>
            <p class="bs-sub">Loading game assets…</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
